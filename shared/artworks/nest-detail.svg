<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><rect width="1600" height="1040" fill="#edf0e6"/><text x="130" y="175" font-family="Georgia,serif" font-size="76" fill="#243d4c">A shelf for every curiosity.</text><rect x="130" y="260" width="1340" height="110" rx="8" fill="#d5e0d7"/><text x="165" y="328" font-family="sans-serif" font-size="35" fill="#263d3d">01  Browse by a question</text><rect x="130" y="410" width="1340" height="110" rx="8" fill="#e7ddcc"/><text x="165" y="478" font-family="sans-serif" font-size="35" fill="#263d3d">02  Read a short note</text><rect x="130" y="560" width="1340" height="110" rx="8" fill="#c9d7e0"/><text x="165" y="628" font-family="sans-serif" font-size="35" fill="#263d3d">03  Save your next book</text><rect x="130" y="710" width="1340" height="110" rx="8" fill="#dfd3c8"/><text x="165" y="778" font-family="sans-serif" font-size="35" fill="#263d3d">04  Return to your shelf</text></svg>