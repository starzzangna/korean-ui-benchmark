<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탐색과 정렬 실행 예제</title><link rel="stylesheet" href="style.css"><body><main><h1>같은 축, 자연스러운 탐색</h1><p>키보드 초점과 긴 문구, 글자 확대에서도 행동의 위치를 확인합니다.</p><section class="works" aria-label="작품 탐색"><article><button class="frame" data-title="첫 번째 작업"><span class="scene">01</span><span class="action"><span>첫 번째 작업의 구성과 상세 내용 살펴보기</span><span aria-hidden="true">↗</span></span></button><p>짧은 작업 설명</p></article><article><button class="frame" data-title="두 번째 작업"><span class="scene">02</span><span class="action"><span>두 번째 작업 보기</span><span aria-hidden="true">↗</span></span></button><p>동등한 이미지와 행동 축</p></article><article><button class="frame" data-title="세 번째 작업"><span class="scene">03</span><span class="action"><span>세 번째 작업 보기</span><span aria-hidden="true">↗</span></span></button><p>설명 길이를 억지로 채우지 않습니다.</p></article></section><section><h2>선택 피드백</h2><button id="choose" class="action" aria-pressed="false"><span>이 수업 선택하기</span><span class="arrow" aria-hidden="true">↗</span></button><p id="selection" role="status">아직 선택하지 않았습니다.</p></section><dialog id="detail" aria-labelledby="title"><div class="dialog-head"><h2 id="title"></h2><button id="close">닫기</button></div><div class="dialog-body" tabindex="0"><p>선택한 작업의 상세입니다. 실제 프로젝트에서는 같은 대상의 자료를 연결합니다.</p><p>트랙은 투명하게, 스크롤은 둥근 바깥 프레임 안에서 처리합니다.</p></div></dialog></main><script src="app.js"></script></body></html>
