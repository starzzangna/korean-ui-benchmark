<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공통 셀렉트 예제</title><link rel="stylesheet" href="select.css"><style>body{font:16px/1.5 system-ui,sans-serif;margin:24px;color:#242424;background:#fafafa}main{max-width:580px}label{display:block;margin-bottom:8px}.field{margin-bottom:24px}select{font:inherit;min-height:48px;padding:10px 12px;border:1px solid #797974;border-radius:6px;background:white;color:inherit}select:focus-visible{outline:3px solid #704d9b;outline-offset:3px}select:disabled{background:#efefed}p{overflow-wrap:anywhere}</style></head><body><main><h1>셀렉트 표시 간격</h1><p>기본 선택 기능은 유지한다. 16px 화살표 상자·12px 우측 여백·12px 문구 여유를 공유한다. 긴 현재 값은 공간이 부족할 때 아래에 표시된다.</p><div class="field"><label for="normal">참가 유형</label><span class="kui-select-shell"><select class="kui-select-native" id="normal" name="normal" ><option value="general">일반 참가 12,000원</option><option value="long">오후 워크숍과 전시 관람이 포함된 참가권 25,000원</option></select><svg class="kui-select-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m3 6 5 5 5-5"/></svg></span></div><div class="field"><label for="disabled">선택 불가</label><span class="kui-select-shell"><select class="kui-select-native" id="disabled" name="disabled" disabled><option value="general">일반 참가 12,000원</option><option value="long">오후 워크숍과 전시 관람이 포함된 참가권 25,000원</option></select><svg class="kui-select-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m3 6 5 5 5-5"/></svg></span></div><div class="field"><label for="invalid">입력 오류</label><span class="kui-select-shell"><select class="kui-select-native" id="invalid" name="invalid" aria-invalid="true" aria-describedby="error"><option value="general">일반 참가 12,000원</option><option value="long">오후 워크숍과 전시 관람이 포함된 참가권 25,000원</option></select><svg class="kui-select-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m3 6 5 5 5-5"/></svg></span></div><p id="error">오류 상태 예시입니다. 제품에서는 실제 검증 결과일 때 표시하세요.</p></main><script src="select.js"></script></body></html>
