<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>NEST 동네 서점의 주제 탐색 화면 · 가상 디자인 연구</title><rect width="1600" height="1040" fill="#dce5e2"/><rect x="56" y="56" width="1488" height="928" rx="22" fill="#faf8f0"/><g font-family="Pretendard,Malgun Gothic,sans-serif" fill="#253e38"><text x="106" y="136" font-size="48" font-weight="700">nest.</text><text x="284" y="130" font-size="22">책을 고르는 작은 서가</text><text x="1150" y="130" font-size="22">주제 탐색</text><text x="1336" y="130" font-size="22">내 서가  02</text><path d="M100 174H1500" stroke="#d3dcd3"/><text x="106" y="234" font-size="18" fill="#69776c">지금의 관심</text><g font-size="23"><rect x="96" y="264" width="226" height="62" rx="10" fill="#d9e4d7"/><text x="119" y="304" font-weight="600">느린 일상</text><text x="119" y="380">작은 발견</text><text x="119" y="456">새로운 시선</text><text x="119" y="532">함께 사는 일</text></g><path d="M354 214V922" stroke="#d3dcd3"/><text x="402" y="250" font-size="18" fill="#69776c">주제로 찾는 큐레이션 / 느린 일상</text><text x="402" y="324" font-size="46" font-weight="650">오늘의 관심에서, 다음 책으로.</text><rect x="402" y="360" width="1090" height="66" rx="10" fill="#f0f1e8" stroke="#d0d8ca"/><text x="430" y="402" font-size="21" fill="#6a786b">마음에 남은 주제나 단어로 찾아보세요</text><text x="402" y="484" font-size="22" font-weight="600">천천히 읽고 싶은 네 가지 이야기</text><g><rect x="402" y="518" width="250" height="266" rx="12" fill="#eadbca"/><rect x="436" y="540" width="180" height="222" rx="4" fill="#a54e38"/><path d="M464 682h118m-118 14h86" stroke="#e5c6a6" stroke-width="2"/><text x="456" y="580" fill="#fff3dc" font-family="Georgia,serif" font-size="27">quiet</text><text x="456" y="614" fill="#fff3dc" font-family="Georgia,serif" font-size="27">days</text><rect x="680" y="518" width="250" height="266" rx="12" fill="#dce4d6"/><rect x="714" y="540" width="180" height="222" rx="4" fill="#355f55"/><path d="M790 620c-54-30-56 34 0 34m0-34c54-30 56 34 0 34v68" fill="none" stroke="#c6d6ae" stroke-width="3"/><text x="736" y="580" fill="#f1ecd5" font-family="Georgia,serif" font-size="23">new roots</text><rect x="958" y="518" width="250" height="266" rx="12" fill="#eee3c4"/><rect x="992" y="540" width="180" height="222" rx="4" fill="#c49c46"/><circle cx="1082" cy="662" r="42" fill="#e6c977"/><text x="1010" y="580" fill="#332f28" font-family="Georgia,serif" font-size="22">small worlds</text><rect x="1236" y="518" width="250" height="266" rx="12" fill="#dce3e7"/><rect x="1270" y="540" width="180" height="222" rx="4" fill="#546b76"/><path d="M1292 712l67-74 68 74" fill="none" stroke="#bfcfca" stroke-width="3"/><text x="1289" y="580" fill="#f0f2df" font-family="Georgia,serif" font-size="23">open fields</text></g><g font-size="21" font-weight="600"><text x="402" y="824">조용한 날들</text><text x="680" y="824">새로운 뿌리</text><text x="958" y="824">작은 세계</text><text x="1236" y="824">열린 들판</text></g><g font-size="17" fill="#69776c"><text x="402" y="858">일상의 속도를 돌아보는 산문</text><text x="680" y="858">주변을 다시 바라보는 이야기</text><text x="958" y="858">작은 장면에서 찾은 발견</text><text x="1236" y="858">익숙한 풍경 너머의 시선</text></g><path d="M402 900H1486" stroke="#d3dcd3"/><text x="402" y="936" font-size="16" fill="#69776c">가상 도서와 가상 서점으로 구성한 화면 연구 · 실제 판매 서비스 아님</text></g></svg>
