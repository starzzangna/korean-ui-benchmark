<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>NEST 책 소개 비교와 내 서가 저장의 세부 화면 · 가상 연구</title><rect width="1600" height="1040" fill="#edf0e8"/><g font-family="Pretendard,Malgun Gothic,sans-serif" fill="#253e38"><text x="86" y="112" font-size="40" font-weight="650">주제에서 고른 책을, 내 서가로.</text><text x="86" y="164" font-size="21" fill="#69776c">책 소개 확인 → 관심 저장 → 다시 찾기 / 가상 인터페이스 연구</text><rect x="86" y="214" width="688" height="690" rx="18" fill="#faf8f0" stroke="#cdd8cd"/><text x="122" y="276" font-size="18" fill="#69776c">01  책 소개를 비교하는 화면</text><rect x="122" y="312" width="210" height="284" rx="5" fill="#a54e38"/><text x="150" y="365" fill="#fff3dc" font-family="Georgia,serif" font-size="33">quiet days</text><path d="M152 514h150m-150 18h104" stroke="#e5c6a6" stroke-width="2"/><text x="368" y="350" font-size="33" font-weight="650">조용한 날들</text><text x="368" y="394" font-size="18" fill="#69776c">느린 일상 / 산문 / 가상 도서</text><text x="368" y="458" font-size="22">일상의 속도를 돌아보며</text><text x="368" y="496" font-size="22">작은 장면을 천천히 읽습니다.</text><rect x="368" y="542" width="238" height="56" rx="8" fill="#355f55"/><text x="402" y="578" font-size="21" fill="#fff6df">내 서가에 담기  +</text><path d="M122 640H738" stroke="#d3dcd3"/><text x="122" y="696" font-size="22" font-weight="600">이 책을 고르는 단서</text><g font-size="20" fill="#596b5e"><text x="122" y="744">• 조용한 일상의 장면을 읽고 싶을 때</text><text x="122" y="786">• 짧은 글부터 시작하고 싶을 때</text></g><rect x="832" y="214" width="682" height="690" rx="18" fill="#faf8f0" stroke="#cdd8cd"/><text x="868" y="276" font-size="18" fill="#69776c">02  선택한 책을 다시 찾는 화면</text><text x="868" y="350" font-size="34" font-weight="650">내 서가</text><text x="868" y="394" font-size="20" fill="#69776c">읽고 싶은 책을 두 권 담아 두었어요.</text><rect x="868" y="444" width="606" height="146" rx="10" fill="#ece6d8"/><rect x="890" y="464" width="72" height="106" rx="3" fill="#a54e38"/><text x="986" y="496" font-size="23" font-weight="600">조용한 날들</text><text x="986" y="536" font-size="18" fill="#69776c">느린 일상에서 고른 책</text><text x="1415" y="520" font-size="28">→</text><rect x="868" y="610" width="606" height="146" rx="10" fill="#e1e7dc"/><rect x="890" y="630" width="72" height="106" rx="3" fill="#355f55"/><text x="986" y="662" font-size="23" font-weight="600">새로운 뿌리</text><text x="986" y="702" font-size="18" fill="#69776c">작은 발견에서 고른 책</text><text x="1415" y="686" font-size="28">→</text><text x="868" y="828" font-size="18" fill="#69776c">저장 상태와 다시 찾는 위치를 같은 화면에서 확인</text><text x="86" y="970" font-size="17" fill="#69776c">제공 콘셉트를 확장해 직접 작성한 SVG · 실제 도서·서점·성과 자료 아님</text></g></svg>
